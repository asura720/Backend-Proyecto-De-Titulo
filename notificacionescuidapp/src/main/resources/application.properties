spring.application.name=notificacionescuidapp
server.port=8084
# Database placeholders - adjust to your environment
spring.datasource.url=jdbc:mysql://localhost:3306/cuidapp_notifications?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Scheduler delay in ms
notifications.scheduler.delay=60000

# Firebase Cloud Messaging (push). Deshabilitado por defecto: si está en false,
# las notificaciones solo se escriben en log (modo simulado) y nada falla.
# Para activar: FCM_ENABLED=true y montar el JSON de la cuenta de servicio en
# la ruta FCM_CREDENTIALS_PATH (ver docker-compose.yml).
app.fcm.enabled=${FCM_ENABLED:false}
app.fcm.credentials-path=${FCM_CREDENTIALS_PATH:/app/firebase-service-account.json}
